[workspace]
members = ["programs/trove"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[workspace.dependencies]
anchor-lang = "=1.2.2"

[profile.release]
# 链上构建保留整数溢出检查。
# Keep integer overflow checks in on-chain builds.
overflow-checks = true
lto = "fat"
codegen-units = 1
