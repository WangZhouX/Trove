server:
  address: ${TROVE_HTTP_HOST:127.0.0.1}
  port: ${TROVE_HTTP_PORT:8080}

spring:
  application:
    name: trove-backend
  datasource:
    # PostgreSQL 连接信息来自运行环境。/ PostgreSQL connection settings come from the runtime environment.
    url: ${TROVE_DB_URL}
    username: ${TROVE_DB_USER}
    password: ${TROVE_DB_PASSWORD}

mybatis-plus:
  configuration:
    # 以列名匹配 record 构造参数，允许查询更换完整列集的顺序。
    # Match record constructor parameters by column name so full projections can reorder columns.
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true

trove:
  solana:
    # 钱包持仓走会话对应网络的服务端 RPC，生产演示可以替换为独立节点。
    # Wallet holdings use a server-side RPC per session network; use a dedicated node for deployed demos.
    devnet-rpc-url: ${TROVE_SOLANA_DEVNET_RPC_URL:https://api.devnet.solana.com}
    localnet-rpc-url: ${TROVE_SOLANA_LOCALNET_RPC_URL:http://127.0.0.1:8899}
